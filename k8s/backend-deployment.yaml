apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/anjali-kanwar/social-media-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URL
              value: mongodb://mongo-service:27017/sayso
            - name: MONGO_URI
              value: mongodb://mongo-service:27017/sayso
            - name: JWT_SECRET
              value: sayso_k8s_secret_key_12345
            - name: NODE_ENV
              value: production
            - name: CLIENT_ORIGIN
              value: "http://localhost:5173"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
