services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sayso-backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - PORT=3000
      - MONGO_URL=mongodb://db:27017/sayso
      - MONGO_URI=mongodb://db:27017/sayso
      - JWT_SECRET=sayso_dev_jwt_secret_key_12345
      - CLIENT_ORIGIN=http://localhost:5173
      - NODE_ENV=development
      # hostname is "db", not "localhost" - inside compose, services
      # find each other by name. This is the fix for Step 6's error.
    networks:
      default:
        aliases:
          - app
          - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sayso-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000/api

  db:
    image: mongo:6
    container_name: sayso-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      # keeps the actual database files around even if this container
      # gets deleted. Without this, deleting the container wipes the data.

volumes:
  mongo-data:
