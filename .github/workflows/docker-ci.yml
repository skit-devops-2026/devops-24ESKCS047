name: Docker CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, test, and push Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set lowercased repository identifiers
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "ACTOR_LOWER=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build backend Docker image
        run: docker build -t sayso-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t sayso-frontend ./frontend

      - name: Run tests inside the container
        run: docker run --rm sayso-backend npm test

      - name: Tag images with commit SHA
        run: |
          docker tag sayso-backend sayso-backend:${{ github.sha }}
          docker tag sayso-frontend sayso-frontend:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag for GHCR
        run: |
          docker tag sayso-backend ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          docker tag sayso-backend ghcr.io/${{ env.REPO_LOWER }}-backend:latest
          docker tag sayso-frontend ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          docker tag sayso-frontend ghcr.io/${{ env.REPO_LOWER }}-frontend:latest

      - name: Push to GHCR
        run: |
          docker push ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LOWER }}-backend:latest
          docker push ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LOWER }}-frontend:latest
