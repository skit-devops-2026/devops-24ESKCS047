global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "sayso-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:3000", "localhost:3000"]
        labels:
          app: "sayso-backend"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
